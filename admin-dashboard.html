<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | LxA International School</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--primary:#2563EB;
--secondary:#0F172A;
--gold:#FBBF24;
--light:#F8FAFC;
--text:#1E293B;
}

body{
background:var(--light);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

header{
background:var(--secondary);
padding:20px 6%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-size:24px;
font-weight:700;
color:white;
}

.logo span{
color:var(--gold);
}

.header-right{
display:flex;
align-items:center;
gap:20px;
}

.welcome-text{
color:#cbd5e1;
font-size:14px;
}

.logout-btn{
padding:10px 22px;
background:var(--gold);
color:black;
border:none;
border-radius:30px;
font-family:'Poppins',sans-serif;
font-weight:600;
cursor:pointer;
font-size:14px;
transition:.3s;
}

.logout-btn:hover{
opacity:.85;
}

.theme-toggle{
width:38px;
height:38px;
border-radius:50%;
background:rgba(255,255,255,.15);
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}

.theme-toggle:hover{
transform:rotate(20deg);
}

body.dark-mode{
background:#020617;
color:#e2e8f0;
}

body.dark-mode header{
background:#111827;
}

body.dark-mode .stat-box,
body.dark-mode .panel,
body.dark-mode .app-card,
body.dark-mode .account-row,
body.dark-mode .empty-note{
background:#1e293b;
color:#e2e8f0;
}

body.dark-mode .panel h3,
body.dark-mode h4,
body.dark-mode .app-card-top h4,
body.dark-mode .account-row-info h4{
color:white;
}

body.dark-mode .filter-tab,
body.dark-mode .accounts-tab{
background:#1e293b;
color:#cbd5e1;
border-color:#334155;
}

body.dark-mode .section-tabs{
border-bottom-color:#334155;
}

body.dark-mode .app-details,
body.dark-mode .account-edit-fields{
border-top-color:#334155;
}

body.dark-mode .message-box{
background:#334155;
color:#e2e8f0;
}

body.dark-mode .edit-field select,
body.dark-mode .edit-field input,
body.dark-mode .add-account-form input,
body.dark-mode .account-edit-fields input{
background:#334155;
color:white;
border-color:#475569;
}

body.dark-mode .edit-field label,
body.dark-mode .add-account-form label{
color:white;
}

body.dark-mode .edit-account-btn{
background:#334155;
color:white;
border-color:#475569;
}

body.dark-mode .account-row{
border-color:#334155;
}

main{
padding:40px 6% 80px;
max-width:1200px;
margin:0 auto;
}

#loadingState{
text-align:center;
padding:80px 0;
color:#666;
}

.stats-row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
margin-bottom:30px;
}

.stat-box{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
text-align:center;
}

.stat-box h2{
color:var(--primary);
font-size:32px;
}

.stat-box p{
color:#888;
font-size:13px;
margin-top:5px;
text-transform:uppercase;
letter-spacing:.5px;
}

.filter-tabs{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.filter-tab{
padding:10px 20px;
border-radius:30px;
border:1px solid #e2e8f0;
background:white;
cursor:pointer;
font-family:'Poppins',sans-serif;
font-size:14px;
font-weight:500;
color:#666;
transition:.25s;
}

.filter-tab.active{
background:var(--primary);
color:white;
border-color:var(--primary);
}

.applications-list{
display:flex;
flex-direction:column;
gap:14px;
}

.app-card{
background:white;
border-radius:14px;
padding:22px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.app-card-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
flex-wrap:wrap;
gap:10px;
cursor:pointer;
}

.app-card-top h4{
color:var(--secondary);
font-size:16px;
margin-bottom:4px;
}

.app-card-top p{
color:#888;
font-size:13px;
}

.status-badge{
padding:5px 14px;
border-radius:20px;
font-size:12px;
font-weight:600;
text-transform:capitalize;
white-space:nowrap;
}

.status-pending{
background:#fef3c7;
color:#92400e;
}

.status-reviewed{
background:#dbeafe;
color:#1e40af;
}

.status-offered{
background:#dcfce7;
color:#166534;
}

.status-rejected{
background:#fee2e2;
color:#991b1b;
}

.app-details{
display:none;
margin-top:20px;
padding-top:20px;
border-top:1px solid #f0f0f0;
}

.app-details.open{
display:block;
}

.detail-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
font-size:14px;
}

.detail-grid strong{
display:block;
color:#888;
font-size:11px;
text-transform:uppercase;
letter-spacing:.5px;
margin-bottom:4px;
}

.message-box{
background:var(--light);
border-radius:10px;
padding:15px;
font-size:14px;
color:#555;
margin-bottom:20px;
}

.edit-row{
display:flex;
gap:15px;
flex-wrap:wrap;
align-items:flex-end;
}

.edit-field label{
display:block;
font-size:13px;
font-weight:500;
color:var(--secondary);
margin-bottom:6px;
}

.edit-field select,
.edit-field input{
padding:10px 14px;
border:1px solid #e2e8f0;
border-radius:8px;
font-family:'Poppins',sans-serif;
font-size:14px;
}

.save-app-btn{
padding:11px 24px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
font-family:'Poppins',sans-serif;
font-weight:600;
cursor:pointer;
font-size:14px;
}

.save-app-btn:hover{
background:var(--secondary);
}

.save-app-btn.saved{
background:#16a34a;
}

.empty-note{
text-align:center;
color:#888;
padding:50px 0;
background:white;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.section-tabs{
display:flex;
gap:6px;
margin-bottom:25px;
border-bottom:2px solid #e2e8f0;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}

.section-tab{
padding:14px 18px;
border:none;
background:none;
cursor:pointer;
font-family:'Poppins',sans-serif;
font-size:15px;
font-weight:600;
color:#888;
border-bottom:2px solid transparent;
margin-bottom:-2px;
transition:.25s;
white-space:nowrap;
flex-shrink:0;
}

.section-tab.active{
color:var(--primary);
border-bottom-color:var(--primary);
}

.accounts-tabs{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.accounts-tab{
padding:10px 20px;
border-radius:30px;
border:1px solid #e2e8f0;
background:white;
cursor:pointer;
font-family:'Poppins',sans-serif;
font-size:14px;
font-weight:500;
color:#666;
transition:.25s;
}

.accounts-tab.active{
background:var(--primary);
color:white;
border-color:var(--primary);
}

.add-account-form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.add-account-form label{
font-size:13px;
font-weight:500;
color:var(--secondary);
display:block;
margin-bottom:6px;
}

.add-account-form input{
width:100%;
padding:10px 12px;
border:1px solid #e2e8f0;
border-radius:8px;
font-family:'Poppins',sans-serif;
font-size:14px;
}

.accounts-list{
display:flex;
flex-direction:column;
gap:12px;
margin-top:10px;
}

.account-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
padding:16px;
border:1px solid #e2e8f0;
border-radius:12px;
}

.account-row-info h4{
color:var(--secondary);
font-size:15px;
margin-bottom:3px;
}

.account-row-info p{
color:#888;
font-size:13px;
}

.account-row-actions{
display:flex;
gap:10px;
}

.edit-account-btn,
.delete-account-btn{
padding:8px 16px;
border:none;
border-radius:8px;
font-family:'Poppins',sans-serif;
font-size:13px;
font-weight:600;
cursor:pointer;
}

.edit-account-btn{
background:var(--light);
color:var(--secondary);
border:1px solid #e2e8f0;
}

.edit-account-btn:hover{
background:#e2e8f0;
}

.delete-account-btn{
background:#fee2e2;
color:#991b1b;
}

.delete-account-btn:hover{
background:#fecaca;
}

.account-edit-fields{
display:none;
margin-top:12px;
padding-top:12px;
border-top:1px solid #f0f0f0;
width:100%;
gap:12px;
align-items:flex-end;
flex-wrap:wrap;
}

.account-edit-fields.open{
display:flex;
}

.account-edit-fields div label{
display:block;
font-size:12px;
color:#888;
margin-bottom:5px;
}

.account-edit-fields input{
padding:8px 10px;
border:1px solid #e2e8f0;
border-radius:6px;
font-family:'Poppins',sans-serif;
font-size:13px;
}

@media(max-width:900px){

main{
padding:30px 5% 60px;
}

.panel{
padding:20px;
}

.stats-row{
gap:10px;
}

.stat-box{
padding:14px;
}

.stat-box h2{
font-size:24px;
}

.app-card{
padding:16px;
}

.app-card-top{
flex-direction:column;
align-items:flex-start;
}

.detail-grid{
grid-template-columns:1fr;
gap:12px;
}

.edit-row{
flex-direction:column;
align-items:stretch;
width:100%;
}

.edit-field{
width:100%;
}

.edit-field select,
.edit-field input{
width:100%;
}

.save-app-btn{
width:100%;
}

.add-account-form{
grid-template-columns:1fr;
}

.account-row{
flex-direction:column;
align-items:stretch;
}

.account-row-actions{
width:100%;
}

.account-row-actions button{
flex:1;
}

.account-edit-fields{
flex-direction:column;
align-items:stretch;
}

.account-edit-fields div{
width:100%;
}

.account-edit-fields input{
width:100%;
}

.account-edit-fields .row-save-btn{
width:100%;
}

.header-right{
gap:10px;
}

.welcome-text{
display:none;
}

}

@media(max-width:600px){

.app-card{
padding:16px;
}

.section-tab{
font-size:13px;
padding:12px 14px;
}

}

</style>
</head>

<body>

<header>
<div class="logo">LxA <span>School</span></div>
<div class="header-right">
<span class="welcome-text" id="welcomeText"></span>
<div class="theme-toggle" id="themeToggle">
<i class="fas fa-moon"></i>
</div>
<button class="logout-btn" id="logoutBtn">Log Out</button>
</div>
</header>

<main>

<div id="loadingState">Loading dashboard...</div>

<div id="dashboardContent" style="display:none;">

<div class="section-tabs" id="sectionTabs">
<button class="section-tab active" data-section="applications">Applications</button>
<button class="section-tab" data-section="approvals">Result Approvals</button>
<button class="section-tab" data-section="accounts">Manage Accounts</button>
</div>

<div id="applicationsSection">

<div class="stats-row" id="statsRow"></div>

<div class="filter-tabs" id="filterTabs">
<button class="filter-tab active" data-status="all">All</button>
<button class="filter-tab" data-status="pending">Pending</button>
<button class="filter-tab" data-status="reviewed">Reviewed</button>
<button class="filter-tab" data-status="offered">Offered</button>
<button class="filter-tab" data-status="rejected">Rejected</button>
</div>

<div class="applications-list" id="applicationsList"></div>

</div>

<div id="approvalsSection" style="display:none;">

<div class="panel">
<h3>Pending Results</h3>
<p style="color:#888;font-size:14px;margin-bottom:20px;">These results are entered but not yet visible to students. Review and approve them below.</p>
<div id="approvalsList"></div>
</div>

</div>

<div id="accountsSection" style="display:none;">

<div class="accounts-tabs" id="accountsTabs">
<button class="accounts-tab active" data-role="student">Students</button>
<button class="accounts-tab" data-role="teacher">Teachers</button>
</div>

<div class="panel">
<h3 id="addAccountTitle">Add New Student</h3>

<form id="addAccountForm" class="add-account-form">

<div>
<label>Full Name</label>
<input type="text" id="newAccFullName" required>
</div>

<div>
<label>Email</label>
<input type="email" id="newAccEmail" required>
</div>

<div>
<label>Password</label>
<input type="password" id="newAccPassword" required minlength="6">
</div>

<div id="studentOnlyFields">
<label>Class</label>
<input type="text" id="newAccClass" placeholder="e.g. Primary 4">
</div>

<div id="studentOnlyFields2">
<label>Admission Number</label>
<input type="text" id="newAccAdmissionNumber" placeholder="e.g. LS/26/002">
</div>

<div id="teacherOnlyFields" style="display:none;">
<label>Subject</label>
<input type="text" id="newAccSubject" placeholder="e.g. Mathematics">
</div>

<button type="submit" class="add-result-btn" id="addAccountBtn">Create Account</button>

</form>

<div class="status-msg" id="addAccountStatus"></div>

</div>

<div class="panel">
<h3 id="accountsListTitle">All Students</h3>
<div class="accounts-list" id="accountsList"></div>
</div>

</div>

</div>

</main>

<script>

const SUPABASE_URL="https://mspjjuhoypfearmpqlko.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zcGpqdWhveXBmZWFybXBxbGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTAwMjQsImV4cCI6MjEwMDI4NjAyNH0.UuieubBSNfX7oGhb6k7w3_8LduWxMzxpGkawrK9OvhI";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allApplications=[];
let currentFilter="all";

// Replace with your actual project ref if different from the one already used above
const EDGE_FUNCTION_URL="https://mspjjuhoypfearmpqlko.supabase.co/functions/v1/dynamic-task";

let currentAccountRole="student";
let allAccounts=[];

const loadingState=document.getElementById("loadingState");

// Dark mode (persisted via localStorage — shared across all pages once hosted)

const themeToggle=document.getElementById("themeToggle");
const themeIcon=themeToggle.querySelector("i");

function applyTheme(isDark){
document.body.classList.toggle("dark-mode",isDark);
themeIcon.classList.toggle("fa-moon",!isDark);
themeIcon.classList.toggle("fa-sun",isDark);
}

try{
applyTheme(localStorage.getItem("lxa-theme")==="dark");
}catch(err){
console.warn("localStorage unavailable:",err);
}

themeToggle.addEventListener("click", function(){
const isDark=!document.body.classList.contains("dark-mode");
applyTheme(isDark);
try{
localStorage.setItem("lxa-theme", isDark?"dark":"light");
}catch(err){
console.warn("localStorage unavailable:",err);
}
});
const dashboardContent=document.getElementById("dashboardContent");
const welcomeText=document.getElementById("welcomeText");
const statsRow=document.getElementById("statsRow");
const filterTabs=document.getElementById("filterTabs");
const applicationsList=document.getElementById("applicationsList");

function escapeHtml(str){
const div=document.createElement("div");
div.textContent=str==null?"":str;
return div.innerHTML;
}

function formatDate(dateStr){
if(!dateStr) return "—";
const d=new Date(dateStr);
if(isNaN(d)) return dateStr;
return d.toLocaleDateString(undefined,{ year:"numeric", month:"short", day:"numeric" });
}

async function init(){

const { data: { session } } = await sb.auth.getSession();

if(!session){
window.location.href="login.html";
return;
}

const userId=session.user.id;

const { data: profile, error: profileError } = await sb
.from("profiles")
.select("*")
.eq("id", userId)
.single();

if(profileError || !profile || profile.role!=="admin"){
await sb.auth.signOut();
window.location.href="login.html";
return;
}

welcomeText.textContent="Welcome, "+profile.full_name;

await loadApplications();

loadingState.style.display="none";
dashboardContent.style.display="block";

}

async function loadApplications(){

const { data, error } = await sb
.from("applications")
.select("*")
.order("created_at",{ ascending:false });

if(error || !data){
applicationsList.innerHTML='<div class="empty-note">Could not load applications. Please refresh and try again.</div>';
console.error("Load applications error:",error);
return;
}

allApplications=data;

renderStats();
renderApplications();

}

function renderStats(){

const counts={ pending:0, reviewed:0, offered:0, rejected:0 };

allApplications.forEach(a=>{
if(counts[a.status]!==undefined) counts[a.status]++;
});

statsRow.innerHTML=
'<div class="stat-box"><h2>'+allApplications.length+'</h2><p>Total</p></div>'+
'<div class="stat-box"><h2>'+counts.pending+'</h2><p>Pending</p></div>'+
'<div class="stat-box"><h2>'+counts.reviewed+'</h2><p>Reviewed</p></div>'+
'<div class="stat-box"><h2>'+counts.offered+'</h2><p>Offered</p></div>'+
'<div class="stat-box"><h2>'+counts.rejected+'</h2><p>Rejected</p></div>';

}

function renderApplications(){

const filtered=currentFilter==="all"
? allApplications
: allApplications.filter(a=>a.status===currentFilter);

if(filtered.length===0){
applicationsList.innerHTML='<div class="empty-note">No applications in this category yet.</div>';
return;
}

applicationsList.innerHTML="";

filtered.forEach(app=>{

const card=document.createElement("div");
card.className="app-card";

card.innerHTML=
'<div class="app-card-top" data-toggle="'+app.id+'">'+
'<div><h4>'+escapeHtml(app.student_name)+'</h4><p>'+escapeHtml(app.class_applying)+' • Submitted '+formatDate(app.created_at)+'</p></div>'+
'<span class="status-badge status-'+app.status+'">'+app.status+'</span>'+
'</div>'+

'<div class="app-details" id="details-'+app.id+'">'+

'<div class="detail-grid">'+
'<div><strong>Student DOB</strong>'+formatDate(app.student_dob)+'</div>'+
'<div><strong>Parent/Guardian</strong>'+escapeHtml(app.parent_name)+'</div>'+
'<div><strong>Phone</strong>'+escapeHtml(app.parent_phone)+'</div>'+
'<div><strong>Email</strong>'+escapeHtml(app.parent_email)+'</div>'+
'</div>'+

(app.message ? '<div class="message-box">'+escapeHtml(app.message)+'</div>' : '')+

'<div class="edit-row">'+
'<div class="edit-field">'+
'<label>Status</label>'+
'<select data-app-id="'+app.id+'" class="status-select">'+
['pending','reviewed','offered','rejected'].map(s=>
'<option value="'+s+'"'+(s===app.status?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'
).join('')+
'</select>'+
'</div>'+
'<div class="edit-field">'+
'<label>Exam / Screening Date</label>'+
'<input type="date" class="exam-date-input" data-app-id="'+app.id+'" value="'+(app.exam_date||'')+'">'+
'</div>'+
'<button class="save-app-btn" data-app-id="'+app.id+'">Save Changes</button>'+
'</div>'+

'</div>';

applicationsList.appendChild(card);

});

document.querySelectorAll(".app-card-top").forEach(top=>{
top.addEventListener("click", function(){
const id=this.getAttribute("data-toggle");
document.getElementById("details-"+id).classList.toggle("open");
});
});

document.querySelectorAll(".save-app-btn").forEach(btn=>{
btn.addEventListener("click", async function(e){

e.stopPropagation();

const appId=this.getAttribute("data-app-id");
const statusSelect=document.querySelector('.status-select[data-app-id="'+appId+'"]');
const examDateInput=document.querySelector('.exam-date-input[data-app-id="'+appId+'"]');

const newStatus=statusSelect.value;
const newExamDate=examDateInput.value || null;

this.textContent="Saving...";
this.disabled=true;

const { error } = await sb
.from("applications")
.update({ status: newStatus, exam_date: newExamDate })
.eq("id", appId);

this.disabled=false;

if(error){
this.textContent="Failed";
console.error("Update error:",error);
setTimeout(()=>{ this.textContent="Save Changes"; },2000);
return;
}

this.textContent="Saved";
this.classList.add("saved");

// Update local copy so stats/badges refresh without a full reload

const appIndex=allApplications.findIndex(a=>a.id===appId);
if(appIndex!==-1){
allApplications[appIndex].status=newStatus;
allApplications[appIndex].exam_date=newExamDate;
}

renderStats();

setTimeout(()=>{
renderApplications();
},600);

});
});

}

filterTabs.addEventListener("click", function(e){

if(!e.target.classList.contains("filter-tab")) return;

document.querySelectorAll(".filter-tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");

currentFilter=e.target.getAttribute("data-status");

renderApplications();

});

document.getElementById("logoutBtn").addEventListener("click", async function(){
const btn=this;
btn.disabled=true;
btn.textContent="Logging out...";
const timeout=new Promise(resolve=>setTimeout(resolve,3000));
try{
await Promise.race([sb.auth.signOut(), timeout]);
}catch(err){
console.error("Sign out error (redirecting anyway):",err);
}finally{
window.location.href="login.html";
}
});

// ===========================================================
// SECTION TABS (Applications vs Manage Accounts)
// ===========================================================

document.getElementById("sectionTabs").addEventListener("click", function(e){

if(!e.target.classList.contains("section-tab")) return;

document.querySelectorAll(".section-tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");

const section=e.target.getAttribute("data-section");

document.getElementById("applicationsSection").style.display = section==="applications" ? "block" : "none";
document.getElementById("approvalsSection").style.display = section==="approvals" ? "block" : "none";
document.getElementById("accountsSection").style.display = section==="accounts" ? "block" : "none";

if(section==="accounts" && allAccounts.length===0){
loadAccounts();
}

if(section==="approvals"){
loadPendingResults();
}

});

// ===========================================================
// MANAGE ACCOUNTS — student/teacher tab switching
// ===========================================================

document.getElementById("accountsTabs").addEventListener("click", function(e){

if(!e.target.classList.contains("accounts-tab")) return;

document.querySelectorAll(".accounts-tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");

currentAccountRole=e.target.getAttribute("data-role");

document.getElementById("addAccountTitle").textContent =
currentAccountRole==="student" ? "Add New Student" : "Add New Teacher";

document.getElementById("accountsListTitle").textContent =
currentAccountRole==="student" ? "All Students" : "All Teachers";

document.getElementById("studentOnlyFields").style.display = currentAccountRole==="student" ? "block" : "none";
document.getElementById("studentOnlyFields2").style.display = currentAccountRole==="student" ? "block" : "none";
document.getElementById("teacherOnlyFields").style.display = currentAccountRole==="teacher" ? "block" : "none";

renderAccounts();

});

async function loadAccounts(){

document.getElementById("accountsList").innerHTML='<div class="empty-note">Loading...</div>';

const { data, error } = await sb
.from("profiles")
.select("*")
.in("role",["student","teacher"])
.order("full_name",{ ascending:true });

if(error || !data){
document.getElementById("accountsList").innerHTML='<div class="empty-note">Could not load accounts. Please refresh and try again.</div>';
console.error("Load accounts error:",error);
return;
}

allAccounts=data;

renderAccounts();

}

function renderAccounts(){

const list=document.getElementById("accountsList");

const filtered=allAccounts.filter(a=>a.role===currentAccountRole);

if(filtered.length===0){
list.innerHTML='<div class="empty-note">No '+currentAccountRole+'s added yet.</div>';
return;
}

list.innerHTML="";

filtered.forEach(acc=>{

const row=document.createElement("div");
row.className="account-row";

const subLine = currentAccountRole==="student"
? "Class: "+(acc.class||"—")+" • Admission No: "+(acc.admission_number||"—")
: "Subject: "+(acc.subject||"—");

row.innerHTML=
'<div class="account-row-info"><h4>'+escapeHtml(acc.full_name)+'</h4><p>'+subLine+'</p></div>'+
'<div class="account-row-actions">'+
'<button class="edit-account-btn" data-id="'+acc.id+'">Edit</button>'+
'<button class="delete-account-btn" data-id="'+acc.id+'">Delete</button>'+
'</div>'+
'<div class="account-edit-fields" id="edit-fields-'+acc.id+'">'+
'<div><label>Full Name</label><input type="text" class="edit-full-name" value="'+escapeHtml(acc.full_name)+'"></div>'+
(currentAccountRole==="student"
? '<div><label>Class</label><input type="text" class="edit-class" value="'+escapeHtml(acc.class||"")+'"></div>'+
'<div><label>Admission No</label><input type="text" class="edit-admission" value="'+escapeHtml(acc.admission_number||"")+'"></div>'
: '<div><label>Subject</label><input type="text" class="edit-subject" value="'+escapeHtml(acc.subject||"")+'"></div>'
)+
'<button class="row-save-btn" data-save-id="'+acc.id+'">Save</button>'+
'</div>';

list.appendChild(row);

});

document.querySelectorAll(".edit-account-btn").forEach(btn=>{
btn.addEventListener("click", function(){
const id=this.getAttribute("data-id");
document.getElementById("edit-fields-"+id).classList.toggle("open");
});
});

document.querySelectorAll("[data-save-id]").forEach(btn=>{
btn.addEventListener("click", async function(){

const id=this.getAttribute("data-save-id");
const container=document.getElementById("edit-fields-"+id);

const updates={ full_name: container.querySelector(".edit-full-name").value };

if(currentAccountRole==="student"){
updates.class=container.querySelector(".edit-class").value;
updates.admission_number=container.querySelector(".edit-admission").value;
}else{
updates.subject=container.querySelector(".edit-subject").value;
}

this.textContent="Saving...";
this.disabled=true;

const { error } = await sb.from("profiles").update(updates).eq("id", id);

this.disabled=false;

if(error){
this.textContent="Failed";
console.error("Update account error:",error);
setTimeout(()=>{ this.textContent="Save"; },2000);
return;
}

this.textContent="Saved";

const idx=allAccounts.findIndex(a=>a.id===id);
if(idx!==-1){ Object.assign(allAccounts[idx], updates); }

setTimeout(()=>{
renderAccounts();
},600);

});
});

document.querySelectorAll(".delete-account-btn").forEach(btn=>{
btn.addEventListener("click", async function(){

const id=this.getAttribute("data-id");
const acc=allAccounts.find(a=>a.id===id);

const confirmed=confirm("Permanently delete "+acc.full_name+"'s account? This cannot be undone.");

if(!confirmed) return;

this.textContent="Deleting...";
this.disabled=true;

const { data: { session } } = await sb.auth.getSession();

try{

const res=await fetch(EDGE_FUNCTION_URL, {
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+session.access_token
},
body: JSON.stringify({ action:"delete", userId:id })
});

const result=await res.json();

if(!res.ok || result.error){
throw new Error(result.error || "Delete failed");
}

allAccounts=allAccounts.filter(a=>a.id!==id);
renderAccounts();

}catch(err){
alert("Could not delete this account: "+err.message);
console.error("Delete account error:",err);
this.textContent="Delete";
this.disabled=false;
}

});
});

}

document.getElementById("addAccountForm").addEventListener("submit", async function(e){

e.preventDefault();

const submitBtn=document.getElementById("addAccountBtn");
const originalText=submitBtn.textContent;
submitBtn.disabled=true;
submitBtn.textContent="Creating...";

const statusMsg=document.getElementById("addAccountStatus");
statusMsg.classList.remove("show","success","error");

const payload={
action:"create",
email:document.getElementById("newAccEmail").value.trim(),
password:document.getElementById("newAccPassword").value,
role:currentAccountRole,
full_name:document.getElementById("newAccFullName").value.trim()
};

if(currentAccountRole==="student"){
payload.class=document.getElementById("newAccClass").value.trim();
payload.admission_number=document.getElementById("newAccAdmissionNumber").value.trim();
}else{
payload.subject=document.getElementById("newAccSubject").value.trim();
}

try{

const { data: { session } } = await sb.auth.getSession();

const res=await fetch(EDGE_FUNCTION_URL, {
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+session.access_token
},
body: JSON.stringify(payload)
});

const result=await res.json();

if(!res.ok || result.error){
throw new Error(result.error || "Failed to create account");
}

statusMsg.textContent=currentAccountRole.charAt(0).toUpperCase()+currentAccountRole.slice(1)+" account created successfully.";
statusMsg.classList.add("show","success");

document.getElementById("addAccountForm").reset();

allAccounts=[];
await loadAccounts();

}catch(err){

statusMsg.textContent="Error: "+err.message;
statusMsg.classList.add("show","error");
console.error("Create account error:",err);

}

submitBtn.disabled=false;
submitBtn.textContent=originalText;

setTimeout(()=>{
statusMsg.classList.remove("show");
},5000);

});

// ===========================================================
// RESULT APPROVALS
// ===========================================================

async function loadPendingResults(){

const list=document.getElementById("approvalsList");

list.innerHTML='<div class="empty-note">Loading...</div>';

const { data, error } = await sb
.from("results")
.select("*, student:profiles!results_student_id_fkey(full_name,class), teacher:profiles!results_entered_by_fkey(full_name)")
.eq("approved", false)
.order("created_at",{ ascending:true });

if(error){
list.innerHTML='<div class="empty-note">Could not load pending results. Please refresh and try again.</div>';
console.error("Load pending results error:",error);
return;
}

if(!data || data.length===0){
list.innerHTML='<div class="empty-note">No results waiting for approval right now.</div>';
return;
}

list.innerHTML="";

data.forEach(r=>{

const studentName=r.student ? r.student.full_name : "Unknown student";
const studentClass=r.student ? (r.student.class||"—") : "—";
const teacherName=r.teacher ? r.teacher.full_name : "Unknown teacher";

const card=document.createElement("div");
card.className="account-row";

card.innerHTML=
'<div class="account-row-info">'+
'<h4>'+escapeHtml(studentName)+' — '+escapeHtml(r.subject)+'</h4>'+
'<p>Class: '+escapeHtml(studentClass)+' • '+escapeHtml(r.term)+' '+escapeHtml(r.session)+' • Score: '+escapeHtml(String(r.score))+' ('+escapeHtml(r.grade||"—")+') • Entered by '+escapeHtml(teacherName)+'</p>'+
'</div>'+
'<div class="account-row-actions">'+
'<button class="edit-account-btn approve-result-btn" data-id="'+r.id+'">Approve</button>'+
'</div>';

list.appendChild(card);

});

document.querySelectorAll(".approve-result-btn").forEach(btn=>{
btn.addEventListener("click", async function(){

const id=this.getAttribute("data-id");

this.textContent="Approving...";
this.disabled=true;

const { error } = await sb.from("results").update({ approved:true }).eq("id", id);

if(error){
this.textContent="Failed";
console.error("Approve result error:",error);
this.disabled=false;
setTimeout(()=>{ this.textContent="Approve"; },2000);
return;
}

loadPendingResults();

});
});

}

init();

</script>
