<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LxA International School</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--primary:#2563EB;
--secondary:#0F172A;
--gold:#FBBF24;
--light:#F8FAFC;
--text:#1E293B;
}

body{
background:var(--secondary);
min-height:100vh;
min-height:100dvh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-wrap{
background:#fff;
width:100%;
max-width:420px;
border-radius:20px;
padding:45px 40px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.login-logo{
text-align:center;
margin-bottom:10px;
font-size:26px;
font-weight:700;
color:var(--secondary);
}

.login-logo span{
color:var(--gold);
}

.login-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
font-size:14px;
}

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:500;
color:var(--secondary);
font-size:14px;
}

.form-group input{
width:100%;
padding:14px 16px;
border:1px solid #e2e8f0;
border-radius:10px;
font-family:'Poppins',sans-serif;
font-size:15px;
transition:.3s;
}

.form-group input:focus{
outline:none;
border-color:var(--primary);
}

.login-btn{
width:100%;
padding:15px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
font-family:'Poppins',sans-serif;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.4s;
margin-top:5px;
}

.login-btn:hover{
background:var(--secondary);
}

.login-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.login-error{
display:none;
background:#fee2e2;
color:#991b1b;
padding:12px 16px;
border-radius:8px;
font-size:14px;
margin-bottom:20px;
text-align:center;
}

.login-error.show{
display:block;
}

.back-link{
display:block;
text-align:center;
margin-top:25px;
color:var(--primary);
text-decoration:none;
font-size:14px;
}

.back-link:hover{
text-decoration:underline;
}

.theme-toggle{
position:fixed;
top:20px;
right:20px;
width:42px;
height:42px;
border-radius:50%;
background:rgba(255,255,255,.15);
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}

.theme-toggle:hover{
transform:rotate(20deg);
}

body.dark-mode{
background:#020617;
}

body.dark-mode .login-wrap{
background:#1e293b;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

body.dark-mode .login-logo{
color:white;
}

body.dark-mode .login-subtitle{
color:#94a3b8;
}

body.dark-mode .form-group label{
color:white;
}

body.dark-mode .form-group input{
background:#334155;
color:white;
border-color:#475569;
}

body.dark-mode .back-link{
color:var(--gold);
}

</style>
</head>

<body>

<div class="theme-toggle" id="themeToggle">
<i class="fas fa-moon"></i>
</div>

<div class="login-wrap">

<div class="login-logo">LxA <span>School</span></div>
<div class="login-subtitle">Sign in to your student or staff portal</div>

<div class="login-error" id="loginError"></div>

<form id="loginForm">

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" required autocomplete="email">
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" required autocomplete="current-password">
</div>

<button type="submit" class="login-btn" id="loginBtn">Sign In</button>

</form>

<a href="index.html" class="back-link">← Back to school website</a>

</div>

<script>

const SUPABASE_URL="https://mspjjuhoypfearmpqlko.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zcGpqdWhveXBmZWFybXBxbGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTAwMjQsImV4cCI6MjEwMDI4NjAyNH0.UuieubBSNfX7oGhb6k7w3_8LduWxMzxpGkawrK9OvhI";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginForm=document.getElementById("loginForm");
const loginError=document.getElementById("loginError");
const loginBtn=document.getElementById("loginBtn");

// Dark mode (persisted via localStorage — shared across all pages once hosted)

const themeToggle=document.getElementById("themeToggle");
const themeIcon=themeToggle.querySelector("i");

function applyTheme(isDark){
document.body.classList.toggle("dark-mode",isDark);
themeIcon.classList.toggle("fa-moon",!isDark);
themeIcon.classList.toggle("fa-sun",isDark);
}

try{
applyTheme(localStorage.getItem("lxa-theme")==="dark");
}catch(err){
console.warn("localStorage unavailable:",err);
}

themeToggle.addEventListener("click", function(){
const isDark=!document.body.classList.contains("dark-mode");
applyTheme(isDark);
try{
localStorage.setItem("lxa-theme", isDark?"dark":"light");
}catch(err){
console.warn("localStorage unavailable:",err);
}
});

// If already logged in, skip straight to the right dashboard

(async function checkExistingSession(){

const { data: { session } } = await sb.auth.getSession();

if(session){

await redirectByRole(session.user.id);

}

})();

async function redirectByRole(userId){

const { data: profile, error } = await sb

.from("profiles")

.select("role")

.eq("id", userId)

.single();

if(error || !profile){

loginError.textContent="We couldn't find a profile for this account. Please contact the school office.";

loginError.classList.add("show");

await sb.auth.signOut();

return;

}

if(profile.role==="student"){

window.location.href="student-portal.html";

}else if(profile.role==="teacher"){

window.location.href="teacher-dashboard.html";

}else if(profile.role==="admin"){

window.location.href="admin-dashboard.html";

}else{

loginError.textContent="Unrecognized account role. Please contact the school office.";

loginError.classList.add("show");

}

}

loginForm.addEventListener("submit", async function(e){

e.preventDefault();

loginError.classList.remove("show");

loginBtn.disabled=true;

loginBtn.textContent="Signing in...";

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value;

const { data, error } = await sb.auth.signInWithPassword({ email, password });

if(error){

loginError.textContent="Incorrect email or password. Please try again.";

loginError.classList.add("show");

loginBtn.disabled=false;

loginBtn.textContent="Sign In";

return;

}

await redirectByRole(data.user.id);

loginBtn.disabled=false;

loginBtn.textContent="Sign In";

});

</script>

</body>
</html>
